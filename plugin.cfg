name="CygonLink"
description="Cygon Link is a bridge designed to connect Cygon seamlessly and directly to your favorite game engines. Built around the USDA (Universal Scene Description) format, it completely eliminates the friction of traditional export/import pipelines. Whether you are modifying geometry or tweaking transforms in Cygon, Cygon Link ensures your game engine is instantly updated. No more manual reimports."
author="InspyrStudio"
version="0.3"
script="addons.gd"
